# SHANKPIT skybox config -- the shipped default (ported in from BIG_O's skybox_default.cfg as part
# of the real engine merge). Every key the sky understands is listed here with its default value.
# Edit a copy and load it (sky_weather_load_config). Keys are case-insensitive, '#' starts a
# comment, colours are RGB 0..1. A bad file is rejected whole (with the line number); it never
# half-applies.
#
# Palettes are keyed on the sun's height: day (high sun) -> golden (dusk) / dawn (morning) -> twilight -> night.
# weather.<clear|overcast|rain|storm>.* is the profile the sky eases toward when the weather changes:
#   cover/rain/storm 0..1 (storm > 0.6 adds lightning), darkness dims the sky, grey drains colour toward grey_tone,
#   fog adds fog density, cloud_tint multiplies cloud colour.
day.zenith 0.13 0.36 0.78
day.horizon 0.6 0.79 0.95
golden.zenith 0.2 0.3 0.58
golden.horizon 1 0.55 0.28
dawn.zenith 0.24 0.3 0.6
dawn.horizon 1 0.62 0.5
twilight.zenith 0.06 0.07 0.24
twilight.horizon 0.42 0.24 0.36
night.zenith 0.008 0.014 0.055
night.horizon 0.03 0.05 0.13
sun.size 3.8
moon.size 3.4
sun.tilt 0.3
stars.count 320
stars.brightness 1
clouds.count 44
clouds.scale 1
clouds.speed 1
horizon.curve 0.5
fog.base 0.002
weather.smoothing 0.6
weather.clear.cover 0.24
weather.clear.rain 0
weather.clear.storm 0
weather.clear.darkness 0
weather.clear.grey 0.06
weather.clear.fog 0.0001
weather.clear.cloud_tint 1 1 1
weather.overcast.cover 0.88
weather.overcast.rain 0
weather.overcast.storm 0
weather.overcast.darkness 0.24
weather.overcast.grey 0.8
weather.overcast.fog 0.0009
weather.overcast.cloud_tint 0.9 0.92 0.96
weather.rain.cover 0.97
weather.rain.rain 0.75
weather.rain.storm 0.15
weather.rain.darkness 0.38
weather.rain.grey 0.86
weather.rain.fog 0.0056
weather.rain.cloud_tint 0.74 0.77 0.84
weather.storm.cover 1
weather.storm.rain 1
weather.storm.storm 1
weather.storm.darkness 0.66
weather.storm.grey 0.85
weather.storm.fog 0.01
weather.storm.cloud_tint 0.62 0.62 0.7
weather.clear.grey_tone 0.98 1 1.08
weather.overcast.grey_tone 0.98 1 1.08
