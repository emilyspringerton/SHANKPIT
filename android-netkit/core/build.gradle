plugins { id 'java-library' }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
dependencies {
    // SSH transport. Stopgap-labelled per root CLAUDE.md "Core Deps Are PARENA-First":
    // a PARENA-native SSH client is the real replacement (tracked in BACKLOG).
    api 'com.github.mwiede:jsch:0.2.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.sshd:sshd-core:2.12.1'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
}
