<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11161c">
<meta name="mobile-web-app-capable" content="yes">
<title>shankpit-460</title>
<!--
  Android build of shankpit-460.

  This page is deliberately NOT the WOTAN one: no marketing shell, no external
  fonts, no site nav, no server-only CSS. It is the smallest host the wasm
  bundle (shankpit460.wasm + sp-host.js, both vendored verbatim from
  WOTAN/shankpit-460) needs, plus the touch layer in android-controls.js.

  sp-host.js is generated by `parena build` and is not edited by hand; every
  Android-specific behaviour lives in android-controls.js, which installs a
  virtual gamepad and an offline matchmaking shim BEFORE the generated host
  module runs (classic script, end of body, so it executes ahead of the
  deferred module).
-->
<style>
  :root { --ink: #ece6d8; --dim: #9b9484; --bg: #11161c; --accent: #d8a657; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; -webkit-touch-callout: none;
  }
  #sp-stage { position: fixed; inset: 0; background: #000; overflow: hidden; }
  #sp-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; image-rendering: pixelated; background: #000;
    touch-action: none; outline: none;
  }
  #sp-canvas[hidden] { display: none; }

  #sp-load {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .5rem;
    text-align: center; padding: 1.5rem; background: var(--bg);
  }
  #sp-load b { font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #sp-load span { color: var(--dim); font-size: .85rem; max-width: 22rem; line-height: 1.4; }
  #sp-load[hidden] { display: none; }

  #sp-hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: .5rem;
    padding: calc(.4rem + env(safe-area-inset-top)) .6rem .4rem .6rem;
    font-size: .7rem; letter-spacing: .04em;
    pointer-events: none; z-index: 4;
  }
  #sp-pill, #sp-offline {
    padding: .2rem .5rem; border-radius: 999px;
    background: rgba(17, 22, 28, .72); border: 1px solid rgba(236, 230, 216, .18);
    color: var(--ink); white-space: nowrap;
  }
  #sp-offline { color: var(--accent); border-color: rgba(216, 166, 87, .5); }
  #sp-offline[hidden] { display: none; }
  #sp-online { color: var(--dim); white-space: nowrap; }
  #sp-online:empty { display: none; }
  #sp-hud .grow { flex: 1 1 auto; }

  #sp-mute, #sp-fullscreen {
    pointer-events: auto; font: inherit; font-size: .7rem;
    color: var(--ink); background: rgba(17, 22, 28, .72);
    border: 1px solid rgba(236, 230, 216, .18); border-radius: 999px;
    padding: .55rem .8rem; min-height: 2rem;
  }
  #sp-fullscreen[disabled] { opacity: .4; }
  /* Fullscreen in a WebView is the activity itself; the button is dead weight. */
  #sp-fullscreen { display: none; }

  #sp-stat {
    position: absolute; left: .6rem; bottom: calc(.3rem + env(safe-area-inset-bottom));
    font-size: .58rem; color: rgba(155, 148, 132, .75); z-index: 3;
    pointer-events: none; max-width: 46%;
  }
  #sp-who { position: absolute; right: .6rem; bottom: calc(.3rem + env(safe-area-inset-bottom));
    font-size: .58rem; color: rgba(155, 148, 132, .75); z-index: 3; pointer-events: none; max-width: 46%; text-align: right; }
  #sp-who a { pointer-events: auto; color: var(--accent); }
  #sp-who a[hidden] { display: none; }

  /* ---- touch controls (android-controls.js owns behaviour) ---- */
  #sp-touch { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  #sp-touch .ctl { position: absolute; pointer-events: auto; touch-action: none; }

  #sp-stick {
    left: calc(.9rem + env(safe-area-inset-left));
    bottom: calc(.9rem + env(safe-area-inset-bottom));
    width: 8.5rem; height: 8.5rem; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(236,230,216,.09), rgba(236,230,216,.04) 62%, rgba(236,230,216,0) 70%);
    border: 1px solid rgba(236, 230, 216, .2);
  }
  #sp-knob {
    position: absolute; left: 50%; top: 50%; width: 3.4rem; height: 3.4rem;
    margin: -1.7rem 0 0 -1.7rem; border-radius: 50%;
    background: rgba(236, 230, 216, .22); border: 1px solid rgba(236, 230, 216, .38);
  }

  #sp-buttons { position: absolute; right: calc(.6rem + env(safe-area-inset-right)); bottom: calc(.6rem + env(safe-area-inset-bottom));
    width: 12.5rem; height: 11rem; pointer-events: none; }
  #sp-buttons .btn {
    position: absolute; pointer-events: auto; touch-action: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: var(--ink);
    background: rgba(17, 22, 28, .5); border: 1px solid rgba(236, 230, 216, .28);
    font-size: .62rem; letter-spacing: .06em; text-transform: uppercase;
  }
  #sp-buttons .btn.on { background: rgba(216, 166, 87, .55); border-color: rgba(216, 166, 87, .9); }
  #btn-fire   { right: 0; bottom: 1.1rem; width: 4.6rem; height: 4.6rem; font-size: .72rem;
                background: rgba(216, 87, 87, .32); border-color: rgba(216, 120, 87, .6); }
  #btn-jump   { right: 4.9rem; bottom: 3.2rem; width: 3.2rem; height: 3.2rem; }
  #btn-crouch { right: 1.2rem; bottom: 6.1rem; width: 3.2rem; height: 3.2rem; }
  #btn-reload { right: 4.6rem; bottom: 7.0rem; width: 2.9rem; height: 2.9rem; }
  #btn-ability{ right: 7.8rem; bottom: 2.0rem; width: 2.9rem; height: 2.9rem; }
  #btn-swap   { right: 7.6rem; bottom: 5.6rem; width: 2.9rem; height: 2.9rem; }

  @media (orientation: portrait) {
    /* Landscape is the game's shape; say so instead of shipping a broken layout. */
    #sp-touch { display: none; }
    #sp-rotate { display: flex; }
  }
  #sp-rotate {
    display: none; position: absolute; inset: 0; z-index: 9;
    align-items: center; justify-content: center; text-align: center; padding: 2rem;
    background: var(--bg); color: var(--dim); font-size: .9rem; line-height: 1.5;
  }
</style>
</head>
<body>
<div id="sp-stage">
  <div id="sp-load">
    <b>Starting</b>
    <span id="sp-load-msg">Loading the game (a WebAssembly module, about 200 KB)&hellip;</span>
  </div>
  <canvas id="sp-canvas" width="640" height="360" tabindex="0" role="application"
          aria-label="shankpit-460. Left stick moves, right side drags to aim, fire button to shoot." hidden></canvas>

  <div id="sp-hud" aria-live="polite">
    <span id="sp-pill" role="status">Loading</span>
    <span id="sp-offline" hidden>Offline demo &middot; bots</span>
    <span id="sp-online"></span>
    <span class="grow"></span>
    <button type="button" id="sp-mute" title="Mute / unmute">Sound on</button>
  </div>
  <span id="sp-stat"></span>
  <p id="sp-who"><span id="sp-who-msg"></span> <a id="sp-who-link" hidden></a></p>

  <div id="sp-touch">
    <div class="ctl" id="sp-stick"><div id="sp-knob"></div></div>
    <div id="sp-buttons">
      <div class="btn" id="btn-fire"   data-btn="7" aria-label="Fire">Fire</div>
      <div class="btn" id="btn-jump"   data-btn="0" aria-label="Jump">Jump</div>
      <div class="btn" id="btn-crouch" data-btn="1" aria-label="Crouch">Crouch</div>
      <div class="btn" id="btn-reload" data-btn="2" aria-label="Reload">Reload</div>
      <div class="btn" id="btn-ability"data-btn="6" aria-label="Ability">Ability</div>
      <div class="btn" id="btn-swap"   data-btn="5" aria-label="Next weapon">Weapon</div>
    </div>
  </div>

  <div id="sp-rotate">shankpit-460 plays in landscape. Rotate the device.</div>
</div>

<!-- Runs before the deferred module below: installs the virtual gamepad and the
     offline matchmaking shim, both of which sp-host.js reads on its first frame. -->
<script src="android-controls.js"></script>
<script type="module" src="sp-host.js"></script>
</body>
</html>
