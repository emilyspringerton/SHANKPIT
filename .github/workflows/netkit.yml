name: Netkit APK

# SHANKPIT Netkit (android-netkit + the vendored PARENA page bundle in apps/netkit), built and tested on its own.
#
# Why a separate workflow: the Netkit step in release.yml sits behind "Build Server Control (ncurses)", which has failed on
# every run since 2026-11-08 (ubuntu-latest moved to Ubuntu 26.04 / GCC 15, where an implicit declaration is an error), so the
# Netkit APK was never actually built in CI. This workflow does not depend on any of that, and pins ubuntu-24.04 on purpose.
# release.yml still builds the APK too, for the day the monolith is green and the APK rides along in the release.

on:
  push:
    branches: [master]
    paths:
      - 'android-netkit/**'
      - 'apps/netkit/**'
      - '.github/workflows/netkit.yml'
  pull_request:
    paths:
      - 'android-netkit/**'
      - 'apps/netkit/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apk:
    name: Build, test, package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # headless: every wasm imports nothing and has fixed memory, every export the page calls exists, every id it uses is in index.html
      - name: Verify Netkit web bundle
        shell: bash
        run: |
          set -euo pipefail
          node android-netkit/tools/verify-web-bundle.mjs apps/netkit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # same pinned download release.yml uses for the shankpit-460 APK (no third-party setup action)
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          if [ -d "$SDK/cmdline-tools/cmdline-tools" ]; then
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      # the shell's 16 JVM tests run against real loopback sockets, then the release APK is assembled
      - name: Test the shell and build the APK
        shell: bash
        env:
          SHANKPIT_NETKIT_VERSION_CODE: ${{ github.run_number }}
          SHANKPIT_NETKIT_VERSION_NAME: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.SHANKPIT_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.SHANKPIT_ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.SHANKPIT_ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SHANKPIT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shankpit-netkit-release.keystore"
            export SHANKPIT_NETKIT_KEYSTORE="$RUNNER_TEMP/shankpit-netkit-release.keystore"
            export SHANKPIT_NETKIT_KEYSTORE_PASSWORD="$KEYSTORE_PW"
            export SHANKPIT_NETKIT_KEY_ALIAS="$KEYSTORE_ALIAS"
            export SHANKPIT_NETKIT_KEY_PASSWORD="$KEY_PW"
          else
            echo "::notice::SHANKPIT_ANDROID_KEYSTORE_BASE64 is unset; Netkit is signed with the debug key (sideload only)."
          fi
          gradle -p android-netkit :shell:test :app:assembleRelease --no-daemon --stacktrace
          ls -l android-netkit/app/build/outputs/apk/release/
          cp android-netkit/app/build/outputs/apk/release/app-release.apk "ShankPit_Netkit_${{ github.run_number }}.apk"
          {
            echo "### Netkit APK"
            echo "- ShankPit_Netkit_${{ github.run_number }}.apk: $(wc -c < "ShankPit_Netkit_${{ github.run_number }}.apk") bytes, sha256 $(sha256sum "ShankPit_Netkit_${{ github.run_number }}.apk" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ShankPit_Netkit_${{ github.run_number }}_${{ github.sha }}
          path: ShankPit_Netkit_*.apk
          if-no-files-found: error
