name: Pages

# The SHANKPIT project page (site/ -> _site/ -> GitHub Pages).
#
# Static, dependency-free and atomic: the build job runs the generator and its own artifact check, and only then
# uploads. If the check fails, nothing is published and the last good deploy stays live.
#
# ONE-TIME SETUP (DONE 2026-11-04): Pages is enabled with source "GitHub Actions", via
# `POST /repos/emilyspringerton/SHANKPIT/pages -f build_type=workflow`. It cannot be done from this workflow:
# actions/configure-pages' `enablement` needs an admin token and GITHUB_TOKEN is not admin. Run 41755803522 was the
# first successful build + deploy. The "Is Pages enabled?" step stays so that a future repo in the same state fails
# with one actionable line instead of a bare "Get Pages site failed" -- it is cheap and it has already earned it.
# See site/README.md.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'docs2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Scoped per workflow file, matching deploy.yml/tests.yml's own hard-won rule: a shared group key across sibling
# workflows makes them cancel each other.
concurrency:
  group: shankpit-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build _site/
        run: node site/build.mjs

      - name: Check the artifact
        run: node site/check.mjs

      # Turning a cryptic action failure into one actionable line. actions/configure-pages fails with "Get Pages site
      # failed" when the repository has never had Pages enabled, which reads like a bug in this workflow rather than
      # a missing setting -- it is the setting. The site has already been built and checked by this point, so the
      # message says exactly that: everything works, only publishing is blocked.
      - name: Is Pages enabled?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GET /repos/${{ github.repository }}/pages -> $code"
          if [ "$code" = "200" ]; then
            echo "Pages is enabled on this repository."
            exit 0
          fi
          echo "::error title=GitHub Pages is not enabled::The site built and checked cleanly; only publishing is blocked. Enable it once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions. With an admin token: gh api -X POST repos/${{ github.repository }}/pages -f build_type=workflow"
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
