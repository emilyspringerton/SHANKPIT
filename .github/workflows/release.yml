name: ShankPit Factory

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  # Real, pre-existing bug found live (2026-08-25): this and tests.yml shared the literal same
  # group key, so every push raced the two workflows against each other -- whichever registered
  # first with GitHub's concurrency lock survived, the other was cancelled outright, meaning this
  # release.yml (the ONLY workflow that carries the release job) had never actually gotten to run
  # to completion for a real stretch of pushes today, independent of the mingw-download flake
  # also seen. Scoped per-workflow-file so both run every push, same intent tests.yml's own
  # concurrency block already had (only ever meant to dedupe reruns of the SAME workflow on the
  # SAME ref, not race a sibling workflow).
  group: shankpit-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Normalize merged layout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e apps ] && [ -d apps2 ]; then ln -s apps2 apps; fi
          if [ ! -e packages ] && [ -d packages2 ]; then ln -s packages2 packages; fi
          if [ ! -e docs ] && [ -d docs2 ]; then ln -s docs2 docs; fi

          echo "Normalized layout:"
          ls -al
          test -e apps && echo "apps OK"
          test -e packages && echo "packages OK"
          test -e docs && echo "docs OK" || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 1.22, not go-version-file (this repo's own go.mod only needs 1.21) -- two of the five
          # SHANKPIT OS apps below (PITVIPER, IDUNA.GAME) declare `go 1.22` in their own go.mod. A
          # newer SDK always builds an older-declared module fine, so this satisfies both; pinning
          # to this repo's own older go-version-file would leave those two builds depending on
          # GOTOOLCHAIN=auto silently fetching a newer SDK at build time instead of this step
          # already having the right one.
          go-version: '1.22'

      - name: Go Tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            zip \
            build-essential \
            libncurses-dev \
            wget

          rm -rf sdl2_mingw SDL2-2.30.10 SDL2-devel-2.30.10-mingw.tar.gz || true
          wget -q --retry-connrefused --tries=3 \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz
          tar xzf SDL2-devel-2.30.10-mingw.tar.gz
          mv SDL2-2.30.10/x86_64-w64-mingw32 ./sdl2_mingw

          # SDL2_ttf mingw devel kit, merged into the same sdl2_mingw tree (2026-09-25, founder
          # real-time: "the shankpit os apps dont work - can we get it building with the CICD
          # binaries for all the apps even tho we dont have the signing set up yet"). Three of the
          # five SHANKPIT OS apps (PITVIPER, IDUNA.GAME, EDITOR.GAME) link SDL2_ttf, which the
          # base SDL2 devel kit above doesn't include -- confirmed live via a real local
          # x86_64-w64-mingw32-gcc/go cross-build of all five apps before trusting this here, same
          # discipline as every other fix in this workflow file.
          rm -rf SDL2_ttf-2.22.0 SDL2_ttf-devel-2.22.0-mingw.tar.gz || true
          wget -q --retry-connrefused --tries=3 \
            https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-devel-2.22.0-mingw.tar.gz
          tar xzf SDL2_ttf-devel-2.22.0-mingw.tar.gz
          cp -r SDL2_ttf-2.22.0/x86_64-w64-mingw32/include/SDL2/* sdl2_mingw/include/SDL2/
          cp SDL2_ttf-2.22.0/x86_64-w64-mingw32/lib/*.a sdl2_mingw/lib/
          cp SDL2_ttf-2.22.0/x86_64-w64-mingw32/bin/*.dll sdl2_mingw/bin/

      - name: Build Windows Client
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/lobby/src/main.c

          # Real, live-found CI bug (2026-09-10, "shankpit main repo should be cutting auto
          # releases" -- confirmed via the real job log, fetched directly from the GitHub API:
          # every single run of this workflow had failed or been cancelled since 2026-08-11, and
          # the repo's last real GitHub Release was cut 2026-04-26, over 4 months stale): commit
          # f31cfcd ("GOLDENBAND real bone-skinned mesh replaces Tyler cube body") wired
          # apps/lobby/src/main.c to call gband_mesh_rig_init/gband_mesh_rig_draw, but this
          # build command was never updated to compile+link packages/goldenband's own real
          # sources -- `undefined reference to gband_mesh_rig_draw/init` at the link step.
          # Reproduced and confirmed the exact failure/fix locally (a real x86_64-w64-mingw32-gcc
          # build against a freshly-downloaded SDL2 mingw devel package) before trusting it here.
          #
          # Real, SECOND live-found instance of the exact same class of drift (2026-09-14, founder
          # real-time: "the build is down ... it cant cut a release"): S459-33 wired main.c to call
          # png_decode (spray_registry.h -> packages/world/png_decode_gen.c, a real PARENA-compiled
          # PNG decoder, plus its own minimal vendored Arena/Vec/Bytes runtime,
          # packages/world/parena_runtime.c) -- the Makefile's own LOBBY_SRC and packages/world/
          # BUILD.bazel were both updated for this at the time, but this hand-listed CI command was
          # not, so it failed the identical way: `undefined reference to arena_init/arena_alloc/
          # png_decode/arena_free_all`. Confirmed live via the real GitHub Actions API job log
          # before writing this fix (job 104109838314), same as the gband_mesh_rig precedent above.
          # A real, standing lesson from now THREE real incidents (2026-09-17, S459-87/88:
          # packages/simulation/humanness.c was added to the Makefile's own LOBBY_SRC/SERVER_SRC
          # but not here -- `undefined reference to humanness_tick_mood/humanness_smooth_turn_
          # step/humanness_reaction_delay_ms/humanness_state_init/humanness_aim_noise`, confirmed
          # live via the real GitHub Actions API job log (run 35167996887) before writing this
          # fix, same discipline as the two precedents above): this CI step's own source list is
          # never automatically kept in sync with the Makefile's LOBBY_SRC -- any future new
          # packages/*.c file added to LOBBY_SRC needs this list updated by hand too.
          # FOURTH real recurrence (2026-09-17, S461-01): packages/simulation/ai_nav.c was added
          # to the Makefile's own LOBBY_SRC/SERVER_SRC alongside story_ai.c (which now calls into
          # it) -- added to this hand-copy and tests.yml's own copy in the same pass this time,
          # not after a separate CI failure, per the standing lesson these prior three
          # recurrences already named.
          # FIFTH real recurrence (2026-09-17, S470): packages/goldenband/gseq.c, gpose.c, gsync.c,
          # and gband_skel_npc.c were each added to the Makefile's own LOBBY_SRC across S464/S467
          # but never made it into this hand-copy or tests.yml's own -- found while touching
          # gband_skel_npc.c again for this pass, same undefined-reference failure mode the third
          # recurrence above hit (gseq_clip_load/gpose_compute_skin_matrices/gsync_*/
          # gband_skel_npc_load_kit all missing). Added to this hand-copy and tests.yml's own copy
          # in the same pass, not after a separate CI failure, per the standing lesson.
          # SIXTH real recurrence (2026-09-22, BIG_O engine merge SECTION 536 phases 1/1c/7):
          # packages/simulation/typing_lesson.c, day_night_clock.c, world_rules.c,
          # packages/render/sky_weather.c, and packages/reflux/reflux_mod.c were each added to the
          # Makefile's own LOBBY_SRC (and reflux_mod.c to SERVER_SRC below) across several commits
          # but never made it into this hand-copy or tests.yml's own -- confirmed live via the real
          # GitHub Actions API job log (run 35764647139, `undefined reference to
          # day_night_clock_tick/sky_weather_update/day_night_clock_init`/etc.) before fixing.
          # A SECOND real, distinct bug found in the same pass, NOT a source-list gap: this build
          # had never actually compiled packages/simulation/parena_runtime.h or
          # packages/reflux/parena_runtime.h before (their only prior consumer,
          # cutscene_effect_mod.c, has no Makefile entry) -- both were an accidentally-oversized
          # copy of the full PARENA runtime (unconditional `#include <SDL2/SDL_ttf.h>`, never
          # actually referenced by anything in either package), and this Windows job's SDL2 mingw
          # devel kit doesn't ship SDL2_ttf at all (`fatal error: SDL2/SDL_ttf.h: No such file or
          # directory`). Fixed at the source (both headers replaced with the same minimal,
          # already-CI-proven Arena/Vec/Bytes-only copy packages/world/parena_runtime.h already
          # uses for png_decode_gen.c), not worked around here. Reproduced and confirmed both fixes
          # locally (a real x86_64-w64-mingw32-gcc build against the same SDL2 mingw devel package)
          # before trusting them here, same discipline as every precedent above. Added to this
          # hand-copy and tests.yml's own copy in the same pass.
          # SEVENTH real recurrence (2026-09-22, BIG_O engine merge SECTION 536 phase 7d/7e,
          # "full phone app parity, costume changes, add The Men" follow-up): packages/simulation/
          # witness_ai.c, witness_sim.c, witness_rules.c, npc_archetype.c, zombie_values.c,
          # ai_brain_rules.c, world_alerts_mod.c, and world_alert_bridge.c were each added to the
          # Makefile's own LOBBY_SRC across several commits but never made it into this hand-copy
          # or tests.yml's own -- confirmed live via the real GitHub Actions API job log (run
          # 35794065741, `undefined reference to witness_ai_tick/witness_ai_reset/
          # witness_ai_seed_voxworld_encounter/world_alert_bridge_tick/world_alert_bridge_init`)
          # before fixing, same discipline as every precedent above. Added to this hand-copy,
          # tests.yml's own copy, and both files' own Linux server build below (witness_ai.c and
          # its 5 dependencies only -- the Makefile's own SERVER_SRC never gained world_alerts_mod.c/
          # world_alert_bridge.c, those are client-local only) in the same pass.
          x86_64-w64-mingw32-gcc apps/lobby/src/main.c packages/simulation/story_ai.c packages/simulation/ai_nav.c packages/simulation/humanness.c packages/simulation/cutscene.c packages/simulation/typing_lesson.c packages/simulation/day_night_clock.c packages/simulation/world_rules.c packages/simulation/witness_ai.c packages/simulation/witness_sim.c packages/simulation/witness_rules.c packages/simulation/npc_archetype.c packages/simulation/zombie_values.c packages/simulation/ai_brain_rules.c packages/simulation/world_alerts_mod.c packages/simulation/world_alert_bridge.c packages/simulation/food_pickup.c packages/simulation/giant_bug_values.c packages/simulation/giant_bug_brain.c packages/render/proc_tex.c packages/render/retro_material.c packages/render/retro_sky.c packages/render/sky_weather.c packages/render/retro_lighting.c packages/render/gl_shader.c packages/render/bloom.c packages/world/terrain.c packages/world/parena_runtime.c packages/world/png_decode_gen.c packages/reflux/reflux_runtime.c packages/reflux/reflux_mod.c packages/audio/audio.c \
            packages/goldenband/gband_mesh_rig.c packages/goldenband/gband.c packages/goldenband/gskel.c packages/goldenband/gmesh.c packages/goldenband/gseq.c packages/goldenband/gpose.c packages/goldenband/gsync.c packages/goldenband/gband_skel_npc.c \
            -o ShankPit.exe \
            -O2 -static-libgcc \
            -I./sdl2_mingw/include \
            -I. \
            -Ipackages/common \
            -Ipackages/simulation \
            -Ipackages/render \
            -Ipackages/reflux \
            -Ipackages/world \
            -Ipackages/audio \
            -Ipackages/goldenband \
            -L./sdl2_mingw/lib \
            -lmingw32 -lSDL2main -lSDL2 \
            -lopengl32 -lglu32 -lws2_32 -lwinmm -lgdi32 -lm

      # SHANKPIT OS apps (2026-09-25, founder real-time: "the shankpit os apps dont work - can we
      # get it building with the CICD binaries for all the apps even tho we dont have the signing
      # set up yet"). apps/lobby/src/main.c's own lobby_launch_app spawns each of these as a real,
      # unmodified child process at "<the running exe's own dir>/bundled/<name>.exe"
      # (lobby_app_binary_path) -- that real path search has existed since S537, but this workflow
      # never actually built or bundled any of these five binaries into a release, so every "app"
      # button in the lobby's APPS page failed with "<name> not found (not bundled yet)". These are
      # five separate, real, public sibling repos (github.com/emilyspringerton/<name>), not part of
      # this checkout -- checked out here by name, same as any other public-repo cross-repo
      # checkout. No code signing here on purpose (not set up yet, per the founder's own framing --
      # these binaries will trigger an "unknown publisher" OS warning on first run, a real, known,
      # separate follow-up, not a blocker for getting them built and launchable at all).
      - name: Checkout SHANKPIT OS Apps
        uses: actions/checkout@v4
        with:
          repository: emilyspringerton/DEADWEIGHT
          path: os_apps/DEADWEIGHT
      - uses: actions/checkout@v4
        with:
          repository: emilyspringerton/PITVIPER
          path: os_apps/PITVIPER
      - uses: actions/checkout@v4
        with:
          repository: emilyspringerton/IDUNA.GAME
          path: os_apps/IDUNA.GAME
      - uses: actions/checkout@v4
        with:
          repository: emilyspringerton/REDGARDEN
          path: os_apps/REDGARDEN
      - uses: actions/checkout@v4
        with:
          repository: emilyspringerton/EDITOR.GAME
          path: os_apps/EDITOR.GAME

      - name: Build SHANKPIT OS Apps (Windows)
        shell: bash
        run: |
          set -euo pipefail
          SDLW="$(pwd)/sdl2_mingw"
          mkdir -p bundled

          echo "== DEADWEIGHT dw_gui.exe =="
          ( cd os_apps/DEADWEIGHT
            test -f apps/gui/main.c
            x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -Werror -Icore -Icore/runtime -DPARENA_NO_GRAPHICS "-DDW_VERSION=\"ci\"" \
              -include card_rules.h -O2 -I"$SDLW/include" -I"$SDLW/include/SDL2" \
              apps/gui/main.c apps/gui/fx.c apps/gui/sfx.c core/client.c core/policy.c core/protocol.c core/card_rules.c core/fx_rules.c core/card_text.c core/iduna.c core/http.c \
              -o dw_gui.exe -L"$SDLW/lib" -lmingw32 -lSDL2 -lws2_32 -lbcrypt -mwindows )
          cp os_apps/DEADWEIGHT/dw_gui.exe bundled/

          echo "== PITVIPER pitviper.exe =="
          ( cd os_apps/PITVIPER
            test -f cmd/pitviper/main.go
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
              CGO_CFLAGS="-I$SDLW/include" CGO_LDFLAGS="-L$SDLW/lib" \
              GOWORK=off go build -o pitviper.exe ./cmd/pitviper )
          cp os_apps/PITVIPER/pitviper.exe bundled/

          echo "== IDUNA.GAME idunagame.exe =="
          ( cd os_apps/IDUNA.GAME
            test -f cmd/idunagame/main.go
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
              CGO_CFLAGS="-I$SDLW/include" CGO_LDFLAGS="-L$SDLW/lib" \
              GOWORK=off go build -o idunagame.exe ./cmd/idunagame )
          cp os_apps/IDUNA.GAME/idunagame.exe bundled/

          echo "== REDGARDEN red_garden_arena.exe =="
          ( cd os_apps/REDGARDEN
            test -f apps/arena/src/main.c
            x86_64-w64-mingw32-gcc -std=c99 -D_DEFAULT_SOURCE -O2 -I./packages -I"$SDLW/include" \
              -include ./packages/simulation/bloodflower_mod_host.h \
              -include ./packages/simulation/tree_passive_mod_host.h \
              -include ./packages/simulation/build_template_mod_host.h \
              -include ./packages/simulation/item_curriculum_mod_host.h \
              -include ./packages/simulation/duck_smoke_bomb_mod_host.h \
              -include ./packages/simulation/abraham_fireball_mod_host.h \
              -include ./packages/simulation/bacon_puck_intangible_speed_mod_host.h \
              ./apps/arena/src/main.c \
              ./packages/simulation/arena_game.c \
              ./packages/simulation/arena_replay.c \
              ./packages/simulation/arena_ai_bridge.c \
              ./packages/simulation/bloodflower_mod.c \
              ./packages/simulation/tree_passive_mod.c \
              ./packages/simulation/build_template_mod.c \
              ./packages/simulation/item_curriculum_mod.c \
              ./packages/simulation/duck_smoke_bomb_mod.c \
              ./packages/simulation/abraham_fireball_mod.c \
              ./packages/simulation/bacon_puck_intangible_speed_mod.c \
              ./packages/common/mlp_infer.c \
              ./packages/goldenband/gband.c \
              ./packages/goldenband/gband_rig.c \
              ./packages/goldenband/gskel.c \
              ./packages/goldenband/gmesh.c \
              ./packages/goldenband/gband_mesh_rig.c \
              -o red_garden_arena.exe \
              -L"$SDLW/lib" -lmingw32 -lSDL2main -lSDL2 -lopengl32 -lws2_32 -lm )
          cp os_apps/REDGARDEN/red_garden_arena.exe bundled/

          echo "== EDITOR.GAME editor-game.exe =="
          ( cd os_apps/EDITOR.GAME
            test -f gen/editor_full.c
            PRNFMT_RENAME="-Darena_init=pf_arena_init -Darena_alloc=pf_arena_alloc -Darena_strdup=pf_arena_strdup -Darena_free_all=pf_arena_free_all"
            x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -pedantic $PRNFMT_RENAME -I"$SDLW/include" -c src/arena.c -o /tmp/eg_pf_arena.o
            x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -pedantic $PRNFMT_RENAME -I"$SDLW/include" -c src/fmt.c -o /tmp/eg_pf_fmt.o
            x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -pedantic $PRNFMT_RENAME -Iruntime -Isrc -I"$SDLW/include" -c runtime/prnfmt_bridge.c -o /tmp/eg_pf_bridge.o
            x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -pedantic -Iruntime -I"$SDLW/include" \
              gen/editor_full.c runtime/parena_runtime.c /tmp/eg_pf_bridge.o /tmp/eg_pf_arena.o /tmp/eg_pf_fmt.o \
              -o editor-game.exe -L"$SDLW/lib" -lmingw32 -lSDL2main -lSDL2 -lSDL2_ttf -lm
            rm -f /tmp/eg_pf_arena.o /tmp/eg_pf_fmt.o /tmp/eg_pf_bridge.o )
          cp os_apps/EDITOR.GAME/editor-game.exe bundled/

          # DLL dependencies confirmed via objdump against a real local build of all five --
          # SDL2.dll for all five, SDL2_ttf.dll for PITVIPER/IDUNA.GAME/EDITOR.GAME specifically
          # (dw_gui/red_garden_arena don't link it). Copied into bundled/ itself (not just the
          # Client zip's own top level, which already gets SDL2.dll below) since a child process's
          # own DLL search order checks its own directory first -- don't depend on the parent's
          # working directory happening to also be searched.
          cp "$SDLW/bin/SDL2.dll" bundled/
          cp "$SDLW/bin/SDL2_ttf.dll" bundled/

          ls -la bundled/

      - name: Build Linux Server
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/server/src/main.c

          gcc apps/server/src/main.c packages/simulation/story_ai.c packages/simulation/ai_nav.c packages/simulation/humanness.c packages/simulation/witness_ai.c packages/simulation/witness_sim.c packages/simulation/witness_rules.c packages/simulation/npc_archetype.c packages/simulation/zombie_values.c packages/simulation/ai_brain_rules.c packages/simulation/giant_bug_values.c packages/simulation/giant_bug_brain.c packages/world/terrain.c packages/reflux/reflux_runtime.c packages/reflux/reflux_mod.c \
            -o ShankServer_Linux \
            -O2 -static \
            -I. \
            -Ipackages/common \
            -Ipackages/simulation \
            -Ipackages/world \
            -lm

      - name: Build Server Control (ncurses)
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/server/serverctl.c

          gcc apps/server/serverctl.c \
            -o shankpit_worldctl \
            -std=c99 \
            -O2 \
            -lncurses

      - name: Generate Source Construct
        shell: bash
        run: |
          set -euo pipefail
          OUT="SHANKPIT_CONSTRUCT.txt"
          echo "SHANKPIT BUILD ${{ github.run_number }} CONSTRUCT" > "$OUT"
          echo "" >> "$OUT"

          # Include merged reality: packages/apps/services/docs (only if present).
          ROOTS=""
          for d in packages apps services docs; do
            if [ -d "$d" ]; then ROOTS="$ROOTS $d"; fi
          done

          # Deterministic snapshot of sources (exclude vendored deps, build outputs, SDL blobs, git internals).
          FILES=$(find $ROOTS -type f \
            \( -name "*.c" -o -name "*.h" -o -name "*.go" -o -name "*.md" -o -name "Makefile" -o -name "*.yml" -o -name "*.yaml" \) \
            ! -path "*/.git/*" \
            ! -path "*/vendor/*" \
            ! -path "*/node_modules/*" \
            ! -path "*/artifacts/*" \
            ! -path "*/build/*" \
            ! -path "*/sdl2_mingw/*" \
            ! -path "*/SDL2-2.28.5/*" \
            | sort)

          for file in $FILES; do
            echo "--- FILE START: $file ---" >> "$OUT"
            cat "$file" >> "$OUT"
            echo "" >> "$OUT"
            echo "--- FILE END: $file ---" >> "$OUT"
            echo "" >> "$OUT"
          done

      - name: Bundle Artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUILD="build_${{ github.run_number }}_${GITHUB_SHA::7}"

          rm -rf ShankPit_World ShankPit_Client ShankPit_Bots || true
          rm -f ShankPit_World*.zip ShankPit_Client*.zip ShankPit_Bots*.zip || true

          mkdir -p ShankPit_World
          cp ShankServer_Linux ShankPit_World/
          cp shankpit_worldctl ShankPit_World/
          cp SHANKPIT_CONSTRUCT.txt ShankPit_World/
          printf '%s\n' "./shankpit_worldctl" > ShankPit_World/START_WORLD.sh
          chmod +x ShankPit_World/START_WORLD.sh
          zip -r "ShankPit_World_${BUILD}.zip" ShankPit_World

          mkdir -p ShankPit_Client
          cp ShankPit.exe ShankPit_Client/
          cp sdl2_mingw/bin/SDL2.dll ShankPit_Client/
          cp SHANKPIT_CONSTRUCT.txt ShankPit_Client/
          # S470 real fix (founder real-time, live report against a real screenshot: "no robots
          # tho" -- every character, including the player's own tyler_body, rendered as a plain
          # box body). Root cause: EVERY runtime asset load in apps/lobby/src/main.c resolves a
          # RELATIVE path under "assets/goldenband/..." -- this zip never included assets/ at all,
          # so on a real machine running the extracted client, gband_mesh_rig_init/
          # gband_skel_npc_load_kit failed for tyler_body AND all 5 robot kits alike, every single
          # run, unconditionally. Not a GPU/driver issue -- reproducible on any machine. ShankPit_
          # World (the dedicated server) deliberately does NOT get this: the server never renders,
          # never links packages/goldenband at all (confirmed directly against its own gcc build
          # command above), so it has no real use for these assets.
          cp -r assets ShankPit_Client/
          # SHANKPIT OS apps (2026-09-25) -- lobby_app_binary_path (apps/lobby/src/main.c) looks
          # for each app at "<the running exe's own dir>/bundled/<name>.exe" first; this is the
          # first release that actually populates it, so the lobby's APPS page buttons work.
          cp -r bundled ShankPit_Client/
          printf '%s\n' "start ShankPit.exe" > ShankPit_Client/PLAY.bat
          zip -r "ShankPit_Client_${BUILD}.zip" ShankPit_Client

          mkdir -p ShankPit_Bots
          if [ -f apps/client/bot_main.c ]; then
            gcc apps/client/bot_main.c -o ShankBot_Linux -O2 -static -I. -Ipackages/common -Ipackages/simulation -lm || true
            [ -f ShankBot_Linux ] && cp ShankBot_Linux ShankPit_Bots/
          fi
          cp SHANKPIT_CONSTRUCT.txt ShankPit_Bots/
          zip -r "ShankPit_Bots_${BUILD}.zip" ShankPit_Bots

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShankPit_Builds_${{ github.run_number }}_${{ github.sha }}
          path: |
            ShankPit_World_*.zip
            ShankPit_Client_*.zip
            ShankPit_Bots_*.zip
            SHANKPIT_CONSTRUCT.txt

  # Founder real-time: "ensure all our core repos have auto release non pre release" -- same
  # exact pattern PITVIPER's own ci.yml already established (2026-08-21, "whenever a build passes
  # release it as a minor version" -> "like a . bump" -> "i will handle big bumps to signify human
  # verify releases" -> "pitviper is not pre release" / "pitviper is release release"): auto-bumps
  # MINOR version only on every real push to master (never PRs, never the tag-push this job's own
  # release step triggers), major-version bumps stay a human call. A REAL release (no
  # --prerelease flag), matching "non pre release" literally. Reuses the same build/zip already
  # produced by the job above rather than rebuilding.
  release:
    name: 🚀 Tag & Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 -- need the full tag history to find the current version;
      # actions/checkout's own default shallow clone doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ShankPit_Builds_${{ github.run_number }}_${{ github.sha }}
          path: dist

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            dist/ShankPit_World_*.zip \
            dist/ShankPit_Client_*.zip \
            dist/ShankPit_Bots_*.zip \
            --title "$NEXT_VERSION" \
            --generate-notes
