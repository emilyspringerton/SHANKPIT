name: ShankPit Factory

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  # Scoped per-workflow-file (2026-08-25) -- was the literal same group key as release.yml's own,
  # so every push raced the two workflows against each other and whichever lost got cancelled
  # outright, see release.yml's own concurrency block for the full story.
  group: shankpit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Normalize merged layout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e apps ] && [ -d apps2 ]; then ln -s apps2 apps; fi
          if [ ! -e packages ] && [ -d packages2 ]; then ln -s packages2 packages; fi
          if [ ! -e docs ] && [ -d docs2 ]; then ln -s docs2 docs; fi

          echo "Normalized layout:"
          ls -al
          test -e apps && echo "apps OK"
          test -e packages && echo "packages OK"
          test -e docs && echo "docs OK" || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            zip \
            build-essential \
            libncurses-dev \
            wget

          rm -rf sdl2_mingw SDL2-2.30.10 SDL2-devel-2.30.10-mingw.tar.gz || true
          # --retry-connrefused alone only retries actual connection-refused
          # errors, not timeouts or transient 5xx responses -- widened to a
          # real general-purpose retry (--tries + --timeout so a hung
          # connection doesn't just sit until the job's own overall
          # timeout), same class of gap as BRAWLPIT's own wget step already
          # has (--retry-connrefused --tries=3, same narrow scope).
          wget -q --tries=3 --timeout=30 --retry-connrefused \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz
          tar xzf SDL2-devel-2.30.10-mingw.tar.gz
          mv SDL2-2.30.10/x86_64-w64-mingw32 ./sdl2_mingw

      - name: Build Windows Client
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/lobby/src/main.c

          # Real, THIRD live-found instance of the exact source-list-drift class documented in
          # release.yml's own "Build Windows Client" step (gband_mesh_rig.c, 2026-09-10; S459-33's
          # own packages/world/parena_runtime.c + png_decode_gen.c, 2026-09-14) -- this workflow
          # carries its OWN separate, hand-duplicated copy of the same build command, missed
          # entirely when release.yml was fixed (confirmed live: CI kept failing with the identical
          # `undefined reference to arena_init/arena_alloc/png_decode/arena_free_all` even after
          # that fix, because tests.yml is a second, independent trigger on the same push and this
          # copy was never touched). Two real, hand-maintained copies of one build command is the
          # actual root cause of this whole recurring class of bug -- named here, not fixed by
          # unifying them in this pass (a real, separate refactor, not attempted under this fix).
          x86_64-w64-mingw32-gcc apps/lobby/src/main.c packages/simulation/story_ai.c packages/simulation/cutscene.c packages/render/proc_tex.c packages/render/retro_material.c packages/render/retro_sky.c packages/render/retro_lighting.c packages/render/gl_shader.c packages/world/terrain.c packages/world/parena_runtime.c packages/world/png_decode_gen.c packages/audio/audio.c packages/goldenband/gband.c packages/goldenband/gband_mesh_rig.c packages/goldenband/gmesh.c packages/goldenband/gskel.c \
            -o ShankPit.exe \
            -O2 -static-libgcc \
            -I./sdl2_mingw/include \
            -I. \
            -Ipackages/common \
            -Ipackages/simulation \
            -Ipackages/render \
            -Ipackages/world \
            -Ipackages/audio \
            -Ipackages/goldenband \
            -L./sdl2_mingw/lib \
            -lmingw32 -lSDL2main -lSDL2 \
            -lopengl32 -lglu32 -lws2_32 -lwinmm -lgdi32 -lm

      - name: Build Linux Server
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/server/src/main.c

          gcc apps/server/src/main.c packages/simulation/story_ai.c packages/world/terrain.c \
            -o ShankServer_Linux \
            -O2 -static \
            -I. \
            -Ipackages/common \
            -Ipackages/simulation \
            -Ipackages/world \
            -lm

      - name: Build Server Control (ncurses)
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/server/serverctl.c

          gcc apps/server/serverctl.c \
            -o shankpit_worldctl \
            -std=c99 \
            -O2 \
            -lncurses

      - name: Generate Source Construct
        shell: bash
        run: |
          set -euo pipefail
          OUT="SHANKPIT_CONSTRUCT.txt"
          echo "SHANKPIT BUILD ${{ github.run_number }} CONSTRUCT" > "$OUT"
          echo "" >> "$OUT"

          ROOTS=""
          for d in packages apps services docs; do
            if [ -d "$d" ]; then ROOTS="$ROOTS $d"; fi
          done

          FILES=$(find $ROOTS -type f \
            \( -name "*.c" -o -name "*.h" -o -name "*.go" -o -name "*.md" -o -name "Makefile" -o -name "*.yml" -o -name "*.yaml" \) \
            ! -path "*/.git/*" \
            ! -path "*/vendor/*" \
            ! -path "*/node_modules/*" \
            ! -path "*/artifacts/*" \
            ! -path "*/build/*" \
            ! -path "*/sdl2_mingw/*" \
            ! -path "*/SDL2-2.28.5/*" \
            | sort)

          for file in $FILES; do
            echo "--- FILE START: $file ---" >> "$OUT"
            cat "$file" >> "$OUT"
            echo "" >> "$OUT"
            echo "--- FILE END: $file ---" >> "$OUT"
            echo "" >> "$OUT"
          done

      - name: Bundle Artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUILD="build_${{ github.run_number }}_${GITHUB_SHA::7}"

          rm -rf ShankPit_World ShankPit_Client ShankPit_Bots || true
          rm -f ShankPit_World*.zip ShankPit_Client*.zip ShankPit_Bots*.zip || true

          mkdir -p ShankPit_World
          cp ShankServer_Linux ShankPit_World/
          cp shankpit_worldctl ShankPit_World/
          cp SHANKPIT_CONSTRUCT.txt ShankPit_World/
          printf '%s\n' "./shankpit_worldctl" > ShankPit_World/START_WORLD.sh
          chmod +x ShankPit_World/START_WORLD.sh
          zip -r "ShankPit_World_${BUILD}.zip" ShankPit_World

          mkdir -p ShankPit_Client
          cp ShankPit.exe ShankPit_Client/
          cp sdl2_mingw/bin/SDL2.dll ShankPit_Client/
          cp SHANKPIT_CONSTRUCT.txt ShankPit_Client/
          printf '%s\n' "start ShankPit.exe" > ShankPit_Client/PLAY.bat
          zip -r "ShankPit_Client_${BUILD}.zip" ShankPit_Client

          mkdir -p ShankPit_Bots
          if [ -f apps/client/bot_main.c ]; then
            gcc apps/client/bot_main.c -o ShankBot_Linux -O2 -static -I. -Ipackages/common -Ipackages/simulation -lm || true
            [ -f ShankBot_Linux ] && cp ShankBot_Linux ShankPit_Bots/
          fi
          cp SHANKPIT_CONSTRUCT.txt ShankPit_Bots/
          zip -r "ShankPit_Bots_${BUILD}.zip" ShankPit_Bots

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShankPit_Builds_${{ github.run_number }}_${{ github.sha }}
          path: |
            ShankPit_World_*.zip
            ShankPit_Client_*.zip
            ShankPit_Bots_*.zip
            SHANKPIT_CONSTRUCT.txt

  debug_build:
    name: 🐛 Debug Build (verbose net logging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # S459-53, founder real-time: "any debugging EXEs need to be added as independent CICD
    # builds with their own artifacts" (after being told, correctly, to stop hand-building and
    # sending .exe files directly -- "i download from artifacts only"). A real, independent job
    # (not a step tacked onto the release build above) so a debug build is a real, separate
    # artifact with its own name, never silently bundled into or confused with the real release
    # zips build/release.yml's own job produces. Deliberately in tests.yml, not release.yml --
    # founder real-time: "they may be included in releases if you choose" -- judgment call made
    # here: verbose network logging is a troubleshooting tool for founder/dev use, not something
    # a real player downloading a tagged GitHub Release needs bundled in; tests.yml already runs
    # on every push, so a fresh debug build is available via Actions artifacts (the founder's own
    # stated download path) far more often than a tagged release would provide one anyway.
    #
    # Builds via `make`, not a fourth hand-duplicated gcc invocation -- this repo has TWO real,
    # documented prior CI outages (release.yml's own comments, 2026-09-10 and 2026-09-14) from
    # exactly that anti-pattern (a hand-copied source list silently drifting from the Makefile's
    # own LOBBY_SRC). CFLAGS/SDL2_MINGW_PREFIX are real, already-overridable Makefile variables
    # (SDL2_MINGW_PREFIX added this same session, S459-41's own ea-windows fix) -- a plain
    # command-line `make CFLAGS=... ea-windows` override, no Makefile changes needed here.
    #
    # NET_VERBOSE_LOG=1 (apps/server + apps/lobby): the real, general connect/snapshot/usercmd
    # trace macro used throughout this session's own live debugging (S459-34 through S459-48).
    # NET_JITTER_DIAG=1 / NET_PARITY_DEBUG=1 (apps/lobby only -- grep-confirmed neither macro is
    # referenced anywhere in apps/server): the real reconciliation-jitter diagnostic macros a
    # founder report ("i am still getting a lot of reconciliation jitter") was investigated with
    # earlier this session.
    steps:
      - uses: actions/checkout@v4

      - name: Normalize merged layout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e apps ] && [ -d apps2 ]; then ln -s apps2 apps; fi
          if [ ! -e packages ] && [ -d packages2 ]; then ln -s packages2 packages; fi
          if [ ! -e docs ] && [ -d docs2 ]; then ln -s docs2 docs; fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip build-essential wget

          rm -rf sdl2_mingw SDL2-2.30.10 SDL2-devel-2.30.10-mingw.tar.gz || true
          wget -q --tries=3 --timeout=30 --retry-connrefused \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz
          tar xzf SDL2-devel-2.30.10-mingw.tar.gz
          mv SDL2-2.30.10/x86_64-w64-mingw32 ./sdl2_mingw

      - name: Build debug Linux server (NET_VERBOSE_LOG=1)
        shell: bash
        run: |
          set -euo pipefail
          make server CFLAGS="-O2 -Wall -D_REENTRANT -DNET_VERBOSE_LOG=1"
          mv bin/shank_server ShankServer_Linux_Debug

      - name: Build debug Windows client (NET_VERBOSE_LOG=1, NET_JITTER_DIAG=1, NET_PARITY_DEBUG=1)
        shell: bash
        run: |
          set -euo pipefail
          make ea-windows \
            CFLAGS="-O2 -Wall -D_REENTRANT -DNET_VERBOSE_LOG=1 -DNET_JITTER_DIAG=1 -DNET_PARITY_DEBUG=1" \
            SDL2_MINGW_PREFIX=./sdl2_mingw
          mv bin/shank_lobby.exe ShankPitDebug.exe

      - name: Bundle debug artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUILD="debug_${{ github.run_number }}_${GITHUB_SHA::7}"

          mkdir -p ShankPit_Debug
          cp ShankServer_Linux_Debug ShankPit_Debug/
          cp ShankPitDebug.exe ShankPit_Debug/
          cp sdl2_mingw/bin/SDL2.dll ShankPit_Debug/
          printf '%s\n' "start ShankPitDebug.exe" > ShankPit_Debug/PLAY_DEBUG.bat
          printf '%s\n' "NET_VERBOSE_LOG=1 ./ShankServer_Linux_Debug --deathmatch" > ShankPit_Debug/RUN_DEBUG_SERVER.sh
          chmod +x ShankPit_Debug/RUN_DEBUG_SERVER.sh
          zip -r "ShankPit_Debug_${BUILD}.zip" ShankPit_Debug

      - name: Upload debug build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShankPit_Debug_Builds_${{ github.run_number }}_${{ github.sha }}
          path: ShankPit_Debug_*.zip

  dragonfly_construct:
    name: 🐉 Dragonfly Backend Construct
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Normalize merged layout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e apps ] && [ -d apps2 ]; then ln -s apps2 apps; fi
          if [ ! -e packages ] && [ -d packages2 ]; then ln -s packages2 packages; fi
          if [ ! -e docs ] && [ -d docs2 ]; then ln -s docs2 docs; fi

          echo "Normalized layout:"
          ls -al
          test -d apps2 && echo "apps2 OK" || true
          test -d packages2 && echo "packages2 OK" || true
          test -d services && echo "services OK" || true
          test -d docs2 && echo "docs2 OK" || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Tests (non-blocking for construct generation)
        shell: bash
        run: |
          set -euo pipefail
          go test ./... || true

      - name: Generate Dragonfly Manifest + Construct (scoped, plain txt)
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="DRAGONFLY_MANIFEST.txt"
          CONSTRUCT="DRAGONFLY_CONSTRUCT.txt"

          echo "DRAGONFLY BACKEND MANIFEST ${{ github.run_number }}" > "$MANIFEST"
          echo "commit: $GITHUB_SHA" >> "$MANIFEST"
          echo "generated_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$MANIFEST"
          echo "" >> "$MANIFEST"

          echo "DRAGONFLY BACKEND CONSTRUCT ${{ github.run_number }}" > "$CONSTRUCT"
          echo "commit: $GITHUB_SHA" >> "$CONSTRUCT"
          echo "" >> "$CONSTRUCT"

          # Only include merged backend-ish roots so we don't duplicate full ShankPit construct.
          ROOTS=""
          for d in apps2 packages2 services docs2; do
            if [ -d "$d" ]; then ROOTS="$ROOTS $d"; fi
          done

          # Top-level Go module files are useful context for Go backend builds.
          EXTRAS=""
          [ -f go.mod ] && EXTRAS="$EXTRAS go.mod"
          [ -f go.sum ] && EXTRAS="$EXTRAS go.sum"

          FILES=$(
            {
              for f in $EXTRAS; do
                [ -f "$f" ] && echo "$f"
              done

              if [ -n "$ROOTS" ]; then
                find $ROOTS -type f \
                  \( -name "*.go" -o -name "*.mod" -o -name "*.sum" -o -name "*.md" -o -name "*.txt" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) \
                  ! -path "*/.git/*" \
                  ! -path "*/vendor/*" \
                  ! -path "*/node_modules/*" \
                  ! -path "*/artifacts/*" \
                  ! -path "*/build/*"
              fi
            } | sort -u
          )

          echo "files:" >> "$MANIFEST"
          COUNT=0
          for file in $FILES; do
            [ -f "$file" ] || continue
            SHA=$(sha256sum "$file" | awk '{print $1}')
            SIZE=$(wc -c < "$file" | tr -d ' ')
            printf "%s  %s  %s\n" "$SHA" "$SIZE" "$file" >> "$MANIFEST"
            COUNT=$((COUNT + 1))
          done

          echo "" >> "$MANIFEST"
          echo "total_files: $COUNT" >> "$MANIFEST"

          for file in $FILES; do
            [ -f "$file" ] || continue
            echo "--- FILE START: $file ---" >> "$CONSTRUCT"
            cat "$file" >> "$CONSTRUCT"
            echo "" >> "$CONSTRUCT"
            echo "--- FILE END: $file ---" >> "$CONSTRUCT"
            echo "" >> "$CONSTRUCT"
          done

          # Guardrail: fail if construct is unexpectedly empty
          test -s "$CONSTRUCT"

      - name: Upload Dragonfly Construct Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dragonfly_Construct_${{ github.run_number }}_${{ github.sha }}
          path: |
            DRAGONFLY_MANIFEST.txt
            DRAGONFLY_CONSTRUCT.txt
